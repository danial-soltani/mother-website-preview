.vein-base{position:absolute;inset:0;background:rgba(255,206,141,.07);animation:veinBreathe 36s ease-in-out infinite alternate}
.vein-flow{position:absolute;top:0;bottom:0;left:-78%;width:78%;background:linear-gradient(90deg,transparent 0%,rgba(247,215,169,.015) 28%,rgba(245,215,168,.30) 49%,rgba(247,215,169,.016) 71%,transparent 100%);animation:veinCross 45s linear infinite;will-change:transform}
.page{position:relative;z-index:1}
@keyframes landscapeAwake{0%{opacity:1}28%{opacity:.79}62%{opacity:.36}100%{opacity:0}}
@keyframes veinBreathe{from{opacity:.50}to{opacity:.83}}
@keyframes veinCross{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(235%,0,0)}}
body.no-motion .scenery-veins{opacity:0}
body.no-motion .vein-flow,body.no-motion .vein-base{animation:none}
body.no-motion .nav-progress{transition:none}
/* HOKARI V8.3 — refined dark / gold design system */
:root{--bg:#090a0b;--ink:#f7f1e8;--ink2:#d2c3ae;--muted:#b9ac9b;--navy:#d7ad75;--gold:#deb985;--gold2:#f0d5aa;--line:rgba(230,192,140,.21);--paper:rgba(16,18,19,.84);--surface:rgba(17,19,20,.77);--shadow:0 22px 56px rgba(0,0,0,.3);--radius:18px;--font:'Vazirmatn','Noto Sans Arabic',Tahoma,Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:118px}body{margin:0;min-width:320px;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:clip}body[dir=ltr]{font-family:Inter,'Segoe UI',Arial,sans-serif}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin-top:0}h1,h2,h3{letter-spacing:-.023em}p{line-height:2}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}::selection{background:#aa824b;color:#14110d}[hidden]{display:none!important}
.container{width:min(1220px,calc(100% - 64px));margin-inline:auto}
.scenery{z-index:0;--scenery-opacity:1}.scenery-veins{opacity:.19}.vein-base{background:rgba(255,206,141,.045)}.vein-flow{background:linear-gradient(90deg,transparent 0%,rgba(247,215,169,.003) 30%,rgba(245,215,168,.2) 50%,rgba(247,215,169,.003) 70%,transparent 100%);animation-duration:48s}
body>.preview-ribbon,body>.site-header,body>main,body>.footer{position:relative;z-index:1}
.preview-ribbon{background:rgba(9,10,11,.94);color:#b0a08b;border-bottom:1px solid #c49c6530;font-size:10px}.ribbon-inner{min-height:27px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:3px 0}.ribbon-dot{height:4px;width:4px;background:var(--gold);border-radius:50%;flex:none}.depth-motion-toggle{border:1px solid #b6966854;background:#171714;color:#d3b58b;border-radius:6px;padding:2px 9px;font-size:10px;margin-inline-start:8px;white-space:nowrap}
